<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🔱 MEDUSA::NEXUS</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E%F0%9F%94%B1%3C/text%3E%3C/svg%3E"
  />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="toggle sidebar" title="toggle sidebar (⌘B)">☰</button>
    <a class="brand" href="#/dashboard">🔱 MEDUSA::NEXUS</a>
    <div class="version">v0.1.0-alpha</div>
    <div class="spacer"></div>
    <div class="clock" id="clock">—</div>
    <span class="badge connected"><span class="dot">●</span><span>CONNECTED</span></span>
    <a class="btn" href="/docs" target="_blank">[ SWAGGER ]</a>
  </header>

  <div class="body-grid" id="body-grid">
    <!-- sidebar: 9 primary routes from the Pencil Dashboard design -->
    <nav class="sidebar">
      <div class="sidebar-label">// NAV</div>
      <a class="nav-item" data-route="dashboard" data-tip="DASHBOARD" href="#/dashboard"><span class="arrow">▸</span><span class="name">DASHBOARD</span><span class="count"></span></a>
      <a class="nav-item" data-route="projects"  data-tip="PROJECTS"  href="#/projects"> <span class="arrow">▸</span><span class="name">PROJECTS</span><span class="count"></span></a>
      <a class="nav-item" data-route="scan"      data-tip="SCAN"      href="#/scan">     <span class="arrow">▸</span><span class="name">SCAN</span><span class="count"></span></a>
      <a class="nav-item" data-route="devices"   data-tip="DEVICES"   href="#/devices">  <span class="arrow">▸</span><span class="name">DEVICES</span><span class="count" id="nav-devices-count"></span></a>
      <a class="nav-item" data-route="adb"       data-tip="ADB"       href="#/adb">      <span class="arrow">▸</span><span class="name">ADB</span><span class="count"></span></a>
      <a class="nav-item" data-route="report"    data-tip="REPORT"    href="#/report">   <span class="arrow">▸</span><span class="name">REPORT</span><span class="count"></span></a>
      <a class="nav-item" data-route="tools"     data-tip="TOOLS"     href="#/tools">    <span class="arrow">▸</span><span class="name">TOOLS</span><span class="count"></span></a>
      <a class="nav-item" data-route="recipes"   data-tip="RECIPES"   href="#/recipes">  <span class="arrow">▸</span><span class="name">RECIPES</span><span class="count"></span></a>
      <a class="nav-item" data-route="settings"  data-tip="SETTINGS"  href="#/settings"> <span class="arrow">▸</span><span class="name">SETTINGS</span><span class="count"></span></a>
      <div style="flex:1"></div>
      <a class="nav-item" data-tip="BOOT"     style="opacity:.6" href="#/boot">     <span class="arrow">▸</span><span class="name">BOOT</span></a>
      <a class="nav-item" data-tip="CREDITS"  style="opacity:.6" href="#/about">    <span class="arrow">▸</span><span class="name">CREDITS</span></a>
      <a class="nav-item" data-tip="TERMINAL" style="opacity:.6" href="#/terminal"> <span class="arrow">▸</span><span class="name">TERMINAL</span></a>
    </nav>

    <main id="view"><div class="empty-state">loading…</div></main>
  </div>

  <div class="footer">_ SYSTEM READY _</div>

  <script src="/static/app.js"></script>
</body>
</html>
