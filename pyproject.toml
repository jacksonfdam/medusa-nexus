[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medusa-nexus"
version = "0.1.0"
description = "Unified Mobile Threat Analysis Platform. Every head sees a different angle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Jackson Mafra", email = "jackson.mafra@umain.com" },
]
keywords = [
    "android",
    "security",
    "mobile",
    "frida",
    "jadx",
    "ghidra",
    "burp",
    "mobsf",
    "medusa",
    "stheno",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "frida>=16.1",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "aiofiles>=23.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
mnexus = "mnexus.cli:main"

[project.urls]
Homepage = "https://github.com/jacksonmafra-umain/medusa-nexus"
Issues = "https://github.com/jacksonmafra-umain/medusa-nexus/issues"

[tool.hatch.build.targets.wheel]
packages = ["mnexus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --cov=mnexus --cov-report=term-missing"
testpaths = ["tests"]
